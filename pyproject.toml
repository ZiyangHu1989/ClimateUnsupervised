[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "climate-unsupervised"
version = "0.1.0"
description = "Area-aware unsupervised discovery of global climate regions"
requires-python = ">=3.10"
dependencies = [
  "cdsapi>=0.7.7",
  "joblib>=1.3",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "PyYAML>=6.0",
  "rasterio>=1.3",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "xarray>=2024.1",
  "netCDF4>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
grib = ["cfgrib>=0.9.14"]

[project.scripts]
climate-unsupervised = "climate_unsupervised.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
